name: Flipkart Playwright Scraper

on:
  workflow_dispatch:
    inputs:
      start_row:
        description: "Start input Excel row"
        required: true
        default: "1"
        type: string

      end_row:
        description: "End input Excel row"
        required: true
        default: "2000"
        type: string

      max_rows:
        description: "Maximum pending rows to process in this run"
        required: false
        default: "2000"
        type: string

  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          CI: "true"
          FLIPKART_MAX_ROWS_PER_RUN: ${{ github.event.inputs.max_rows || '2000' }}
        run: |
          python "main.py"

      - name: Diagnose generated files
        if: always()
        run: |
          echo "===== DISK ====="
          df -h

          echo "===== OUTPUT SIZE ====="
          du -sh output/ 2>/dev/null || true

          echo "===== DATA SIZE ====="
          du -sh data/ 2>/dev/null || true

          echo "===== LOGS SIZE ====="
          du -sh logs/ 2>/dev/null || true

          echo "===== FILE COUNT ====="
          find output data logs -type f 2>/dev/null | wc -l

          echo "===== TOP 30 LARGEST FILES ====="
          find output data logs -type f -printf '%s %p\n' 2>/dev/null \
            | sort -nr \
            | head -30

          echo "===== XLSX FILE ====="
          ls -lh output/*.xlsx 2>/dev/null || true

          echo "===== GIT OBJECTS ====="
          git count-objects -vH

            - name: Commit and push updated progress and data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== Git status before commit ==="
          git status --short

          # Get latest remote information
          git fetch origin main

          # Stage scraper output
          git add output/flipkart_sellers.xlsx
          git add data/

          # Commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update Flipkart scraper progress & data [skip ci]"

          # Push the newly created commit
          git push origin HEAD:main

      - name: Upload scraper output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-scraper-output
          path: |
            output/flipkart_sellers.xlsx
            data/
            logs/
          if-no-files-found: warn
          retention-days: 7