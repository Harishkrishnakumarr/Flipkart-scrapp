name: Flipkart Playwright Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"  # 09:00 IST daily (GitHub cron is UTC)

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          python "main.py"

      - name: Upload scraper output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-scraper-output
          path: |
            **/*.xlsx
            **/*.csv
            **/*.json
            **/logs/**
          if-no-files-found: warn
          retention-days: 7
