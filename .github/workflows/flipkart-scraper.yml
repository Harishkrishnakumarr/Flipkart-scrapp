name: Flipkart Playwright Scraper

on:
  workflow_dispatch:
    inputs:
      start_row:
        description: "Start input Excel row"
        required: true
        default: "1"
        type: string

      end_row:
        description: "End input Excel row"
        required: true
        default: "2000"
        type: string

      max_rows:
        description: "Maximum pending rows to process in this run"
        required: false
        default: "2000"
        type: string

  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Chromium & System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Ensure runtime directories exist
        run: |
          mkdir -p output data logs

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          CI: "true"
          START_ROW: ${{ github.event.inputs.start_row || '1' }}
          END_ROW: ${{ github.event.inputs.end_row || '2000' }}
          MAX_ROWS: ${{ github.event.inputs.max_rows || '2000' }}
        run: |
          python main.py \
            --start-row "$START_ROW" \
            --end-row "$END_ROW" \
            --max-rows "$MAX_ROWS" \
            --resume

      - name: Diagnose generated files
        if: always()
        run: |
          echo "===== DISK USAGE ====="
          df -h

          echo "===== DIRECTORY SIZES ====="
          du -sh output/ data/ logs/ 2>/dev/null || true

          echo "===== EXCEL OUTPUT ====="
          ls -lh output/*.xlsx 2>/dev/null || echo "No xlsx found in output/"

          echo "===== DATA DIRECTORY ====="
          ls -lh data/ 2>/dev/null || echo "No files in data/"

      - name: Commit and push updated data & progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage existing generated files safely
          [ -f "output/flipkart_sellers.xlsx" ] && git add -f "output/flipkart_sellers.xlsx"
          [ -d "data" ] && git add -f data/

          if git diff --cached --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Auto-update Flipkart scraper progress & data [skip ci]"
            
            # Pull any remote changes made during the job run using ours strategy for data files
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main
          fi

      - name: Upload scraper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-scraper-output-${{ github.run_id }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: warn
          retention-days: 7